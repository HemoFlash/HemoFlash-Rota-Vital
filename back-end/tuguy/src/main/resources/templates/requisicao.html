<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova requisição</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page">
        <h1 th:text="${requisicao.id == null ? 'Nova requisição' : 'Editar requisição'}">Nova requisição</h1>

        <section class="form-section">
            <form class="user-form"
                  th:action="${requisicao.id == null} ? @{/requisicoes} : @{/requisicoes/{id}(id=${requisicao.id})}"
                  th:object="${requisicao}" method="post">
                <div class="form-field">
                    <label for="titulo">Título</label>
                    <input id="titulo" type="text" th:field="*{titulo}" required>
                    <small class="error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></small>
                </div>

                <div class="form-field">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" rows="5" required></textarea>
                    <small class="error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></small>
                </div>

                <div class="form-field">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" th:field="*{prioridade}" required>
                        <option value="">Selecione uma prioridade</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                    <small class="error" th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}"></small>
                </div>

                <div class="form-field">
                    <label for="tipoSanguineo">Tipo sanguíneo ABO/Rh</label>
                    <select id="tipoSanguineo" th:field="*{tipoSanguineo}" required>
                        <option value="">Selecione um tipo sanguíneo</option>
                        <option value="O-">O-</option>
                        <option value="O+">O+</option>
                        <option value="A-">A-</option>
                        <option value="A+">A+</option>
                        <option value="B-">B-</option>
                        <option value="B+">B+</option>
                        <option value="AB-">AB-</option>
                        <option value="AB+">AB+</option>
                    </select>
                    <small class="error" th:if="${#fields.hasErrors('tipoSanguineo')}" th:errors="*{tipoSanguineo}"></small>
                </div>

                <div class="form-actions">
                    <button class="button" type="submit"
                            th:text="${requisicao.id == null ? 'Enviar requisição' : 'Salvar alterações'}">Enviar requisição</button>
                    <a class="button secondary" href="/menu">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
