<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoFlash | Nova Doação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { hemo: { moss: '#526858', mossHover: '#425447', activeBg: '#EEF2EF', bg: '#F7F8F7', coral: '#D97768', coralHover: '#c56354', textMain: '#2D3748', textSub: '#64748B', border: '#E2E8F0' } }, fontFamily: { sans: ['Inter','sans-serif'] } } } }
  </script>
</head>
<body class="bg-hemo-bg text-hemo-textMain" style="font-family:'Inter',sans-serif;">
  <div class="max-w-3xl mx-auto p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="text-2xl font-bold text-hemo-textMain">Registrar Nova Doação</h2>
        <p class="text-sm text-hemo-textSub">Preencha os dados da coleta para processamento e armazenamento</p>
      </div>
      <a href="/menu" class="text-xs text-hemo-textSub hover:underline">Cancelar</a>
    </div>

    <form class="bg-white p-6 rounded-2xl border border-hemo-border shadow-sm space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Código da Doação</label>
          <input type="text" value="DO-55294" required class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
        </div>
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Doador</label>
          <input type="text" value="Carlos Eduardo" required class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
        </div>
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Tipo Sanguíneo</label>
          <select class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
            <option selected>O+</option>
            <option>O-</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Volume (ml)</label>
          <input type="number" value="450" required class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
        </div>
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Data da Coleta</label>
          <input type="date" value="2025-10-29" required class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
        </div>
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Posto de Coleta</label>
          <select class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
            <option selected>Posto Centro</option>
            <option>Posto Santo André</option>
            <option>Campanha Bairro Novo</option>
          </select>
        </div>
      </div>

      <div class="pt-4 border-t border-hemo-border flex items-center justify-end gap-3">
        <button type="button" class="px-4 py-2 border border-hemo-border text-hemo-textSub text-xs font-bold rounded-lg hover:bg-slate-50">Cancelar</button>
        <button type="submit" class="px-6 py-2 bg-hemo-moss hover:bg-hemo-mossHover text-white text-xs font-bold rounded-lg shadow-sm">Registrar Doação</button>
      </div>
    </form>
  </div>
</body>
</html>
