<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoFlash | Novo Hospital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { hemo: { moss: '#526858', mossHover: '#425447', activeBg: '#EEF2EF', bg: '#F7F8F7', coral: '#D97768', coralHover: '#c56354', textMain: '#2D3748', textSub: '#64748B', border: '#E2E8F0' } }, fontFamily: { sans: ['Inter','sans-serif'] } } } }
  </script>
</head>
<body class="rv-app bg-hemo-bg text-hemo-textMain" style="font-family:'Inter',sans-serif;">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <div class="max-w-3xl mx-auto p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="text-2xl font-bold text-hemo-textMain">Novo Hospital</h2>
        <p class="text-sm text-hemo-textSub">Cadastre uma unidade; o código será gerado automaticamente pelo município</p>
      </div>
      <a href="/hospitais" class="text-xs text-hemo-textSub hover:underline">Cancelar</a>
    </div>

    <p class="mb-4 rounded-lg bg-rose-50 p-3 text-sm text-rose-700" th:if="${erroHospital}" th:text="${erroHospital}"></p>
    <form class="bg-white p-6 rounded-2xl border border-hemo-border shadow-sm space-y-5" th:action="@{/hospitais}" th:object="${hospital}" method="post">
      <div class="grid grid-cols-1 gap-4">
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Nome da instituição</label>
          <input type="text" th:field="*{nome}" placeholder="Ex: Hospital Regional Norte" maxlength="120" required class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
        </div>
        <div>
          <label class="block text-xs font-bold text-hemo-textSub uppercase tracking-wider mb-1">Município</label>
          <input type="text" th:field="*{municipio}" placeholder="Ex: Recife" maxlength="100" required class="w-full px-3 py-2 rounded-lg border border-hemo-border text-sm text-hemo-textMain focus:outline-none focus:ring-1 focus:ring-hemo-moss">
        </div>
      </div>

      <div class="pt-4 border-t border-hemo-border flex items-center justify-end gap-3">
        <a href="/hospitais" class="px-4 py-2 border border-hemo-border text-hemo-textSub text-xs font-bold rounded-lg hover:bg-slate-50">Cancelar</a>
        <button type="submit" class="px-6 py-2 bg-hemo-moss hover:bg-hemo-mossHover text-white text-xs font-bold rounded-lg shadow-sm">Cadastrar Hospital</button>
      </div>
    </form>
  </div>
</body>
</html>
