<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoFlash | Mapa de Cobertura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { hemo: { moss: '#526858', mossHover: '#425447', activeBg: '#EEF2EF', bg: '#F7F8F7', coral: '#D97768', coralHover: '#c56354', textMain: '#2D3748', textSub: '#64748B', border: '#E2E8F0' } }, fontFamily: { sans: ['Inter','sans-serif'] } } } }
  </script>
</head>
<body class="bg-hemo-bg text-hemo-textMain" style="font-family:'Inter',sans-serif;">
  <div class="max-w-7xl mx-auto p-8 space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold text-hemo-textMain">Mapa de Cobertura</h2>
        <p class="text-sm text-hemo-textSub">Áreas de atendimento e pontos de coleta ativos</p>
      </div>
      <a href="/menu" class="text-sm font-semibold text-hemo-moss hover:underline">Voltar ao painel</a>
    </div>

    <div class="bg-white rounded-2xl border border-hemo-border shadow-sm p-6">
      <div class="mb-6 flex gap-3 flex-wrap text-xs font-bold">
        <span class="px-3 py-1.5 rounded-full bg-hemo-activeBg text-hemo-moss">Rede ativa</span>
        <span class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600">Transporte</span>
        <span class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600">Pontos fixos</span>
      </div>

      <div class="relative h-[420px] rounded-2xl overflow-hidden border border-hemo-border bg-gradient-to-br from-slate-50 to-slate-100">
        <div class="absolute inset-0 opacity-40" style="background-image: linear-gradient(...);"></div>
        <div class="absolute left-12 top-8 w-24 h-24 bg-hemo-coral/15 rounded-full"></div>
        <div class="absolute right-20 bottom-14 w-20 h-20 bg-hemo-moss/15 rounded-full"></div>
        <div class="absolute left-32 top-28 w-40 h-20 bg-white/60 rounded-full blur-xl"></div>

        <div class="absolute left-[18%] top-[20%] flex items-center gap-2">
          <span class="w-4 h-4 rounded-full bg-hemo-moss"></span>
          <span class="text-xs font-semibold text-hemo-textMain">Metrô Ana Rosa</span>
        </div>
        <div class="absolute left-[50%] top-[45%] flex items-center gap-2">
          <span class="w-4 h-4 rounded-full bg-hemo-coral"></span>
          <span class="text-xs font-semibold text-hemo-textMain">Eldorado</span>
        </div>
        <div class="absolute right-[18%] bottom-[20%] flex items-center gap-2">
          <span class="w-4 h-4 rounded-full bg-amber-500"></span>
          <span class="text-xs font-semibold text-hemo-textMain">Hospital Central</span>
        </div>

        <div class="absolute right-6 top-6 max-w-xs bg-white rounded-xl border border-hemo-border p-4 shadow-sm">
          <p class="text-xs font-bold uppercase tracking-wider text-hemo-textSub">Seleção</p>
          <h3 class="text-lg font-bold text-hemo-textMain mt-2">Metrô Ana Rosa</h3>
          <p class="text-xs text-hemo-textSub mt-1">4 bolsas disponíveis na última coleta</p>
          <div class="mt-3 flex gap-2 text-[10px] font-bold">
            <span class="bg-hemo-activeBg text-hemo-moss px-2 py-1 rounded-full">A+</span>
            <span class="bg-hemo-activeBg text-hemo-moss px-2 py-1 rounded-full">O-</span>
            <span class="bg-hemo-activeBg text-hemo-moss px-2 py-1 rounded-full">B+</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
