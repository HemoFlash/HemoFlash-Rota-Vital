<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${bolsa.id == null ? 'Nova bolsa' : 'Editar bolsa'}">Nova bolsa</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { hemo: { moss: '#526858', mossHover: '#425447', activeBg: '#EEF2EF', bg: '#F7F8F7', coral: '#D97768', coralHover: '#c56354', textMain: '#2D3748', textSub: '#64748B', border: '#E2E8F0' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-hemo-bg text-hemo-textMain" style="font-family:'Inter',sans-serif;">
  <main class="min-h-screen p-6 md:p-8">
    <div class="mx-auto max-w-3xl rounded-2xl border border-hemo-border bg-white p-6 shadow-sm md:p-8">
      <div class="mb-6 flex items-center justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-[0.2em] text-hemo-textSub">Bolsa</p>
          <h1 class="mt-2 text-3xl font-bold text-hemo-textMain" th:text="${bolsa.id == null ? 'Nova bolsa' : 'Editar bolsa'}">Nova bolsa</h1>
        </div>
        <a href="/menu" class="inline-flex items-center gap-2 rounded-xl border border-hemo-border bg-hemo-activeBg px-4 py-2 text-sm font-semibold text-hemo-textMain hover:bg-slate-100">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>
      </div>

      <form class="space-y-5" th:action="${bolsa.id == null} ? @{/bolsas} : @{/bolsas/{id}(id=${bolsa.id})}" th:object="${bolsa}" method="post">
        <div>
          <label for="codigo" class="mb-2 block text-sm font-semibold text-hemo-textMain">Código</label>
          <input id="codigo" type="text" th:field="*{codigo}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></small>
        </div>

        <div>
          <label for="tipoSanguineo" class="mb-2 block text-sm font-semibold text-hemo-textMain">Tipo sanguíneo</label>
          <select id="tipoSanguineo" th:field="*{tipoSanguineo}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
            <option value="">Selecione um tipo sanguíneo</option>
            <option value="O-">O-</option><option value="O+">O+</option><option value="A-">A-</option><option value="A+">A+</option><option value="B-">B-</option><option value="B+">B+</option><option value="AB-">AB-</option><option value="AB+">AB+</option>
          </select>
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('tipoSanguineo')}" th:errors="*{tipoSanguineo}"></small>
        </div>

        <div>
          <label for="componente" class="mb-2 block text-sm font-semibold text-hemo-textMain">Componente</label>
          <input id="componente" type="text" th:field="*{componente}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('componente')}" th:errors="*{componente}"></small>
        </div>

        <div>
          <label for="quantidadeMl" class="mb-2 block text-sm font-semibold text-hemo-textMain">Quantidade (ml)</label>
          <input id="quantidadeMl" type="number" min="1" th:field="*{quantidadeMl}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('quantidadeMl')}" th:errors="*{quantidadeMl}"></small>
        </div>

        <div>
          <label for="dataColeta" class="mb-2 block text-sm font-semibold text-hemo-textMain">Data de coleta</label>
          <input id="dataColeta" type="date" th:field="*{dataColeta}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('dataColeta')}" th:errors="*{dataColeta}"></small>
        </div>

        <div>
          <label for="dataValidade" class="mb-2 block text-sm font-semibold text-hemo-textMain">Data de validade</label>
          <input id="dataValidade" type="date" th:field="*{dataValidade}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('dataValidade')}" th:errors="*{dataValidade}"></small>
        </div>

        <div>
          <label for="status" class="mb-2 block text-sm font-semibold text-hemo-textMain">Status</label>
          <input id="status" type="text" th:field="*{status}" required class="w-full rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm text-hemo-textMain focus:border-hemo-moss focus:outline-none focus:ring-2 focus:ring-hemo-moss/20">
          <small class="mt-1 block text-sm text-rose-600" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small>
        </div>

        <div class="flex flex-wrap gap-3 pt-2">
          <button class="inline-flex items-center gap-2 rounded-xl bg-hemo-moss px-4 py-3 text-sm font-semibold text-white hover:bg-hemo-mossHover" type="submit" th:text="${bolsa.id == null ? 'Salvar bolsa' : 'Salvar alterações'}">Salvar bolsa</button>
          <a href="/menu" class="inline-flex items-center gap-2 rounded-xl border border-hemo-border bg-white px-4 py-3 text-sm font-semibold text-hemo-textMain hover:bg-hemo-activeBg">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
