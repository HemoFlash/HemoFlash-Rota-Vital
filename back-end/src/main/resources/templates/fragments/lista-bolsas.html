<div xmlns:th="http://www.thymeleaf.org" th:fragment="lista" class="overflow-x-auto rounded-2xl border border-hemo-border bg-white">
  <table class="min-w-full text-left text-sm">
    <thead class="bg-hemo-activeBg text-hemo-textSub">
      <tr>
        <th class="px-4 py-3 font-semibold">Código</th>
        <th class="px-4 py-3 font-semibold">Tipo sanguíneo</th>
        <th class="px-4 py-3 font-semibold">Componente</th>
        <th class="px-4 py-3 font-semibold">Quantidade (ml)</th>
        <th class="px-4 py-3 font-semibold">Data de coleta</th>
        <th class="px-4 py-3 font-semibold">Data de validade</th>
        <th class="px-4 py-3 font-semibold">Status</th>
        <th class="px-4 py-3 font-semibold">Ações</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-hemo-border">
      <tr th:each="bolsa : ${bolsas}">
        <td class="px-4 py-3 font-medium text-hemo-textMain" th:text="${bolsa.codigo}"></td>
        <td class="px-4 py-3 text-hemo-textMain" th:text="${bolsa.tipoSanguineo}"></td>
        <td class="px-4 py-3 text-hemo-textMain" th:text="${bolsa.componente}"></td>
        <td class="px-4 py-3 text-hemo-textMain" th:text="${bolsa.quantidadeMl}"></td>
        <td class="px-4 py-3 text-hemo-textMain" th:text="${bolsa.dataColeta}"></td>
        <td class="px-4 py-3 text-hemo-textMain" th:text="${bolsa.dataValidade}"></td>
        <td class="px-4 py-3">
          <span class="inline-flex rounded-full px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide"
                th:classappend="${#strings.equals(bolsa.status, 'DISPONIVEL')} ? 'bg-emerald-100 text-emerald-700' : (${#strings.equals(bolsa.status, 'ALOCADA')} ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-700')"
                th:text="${bolsa.status}"></span>
        </td>
        <td class="px-4 py-3">
          <div class="flex flex-wrap gap-2" th:if="${requisicao == null}">
            <a class="inline-flex items-center rounded-lg border border-hemo-border bg-white px-3 py-2 text-xs font-semibold text-hemo-textMain hover:bg-hemo-activeBg" th:href="@{/bolsas/{id}/editar(id=${bolsa.id})}">Editar</a>
            <form th:action="@{/bolsas/{id}/remover(id=${bolsa.id})}" method="post">
              <button class="inline-flex items-center rounded-lg bg-rose-600 px-3 py-2 text-xs font-semibold text-white hover:bg-rose-700" type="submit">Remover</button>
            </form>
          </div>
          <form th:if="${requisicao != null}" th:action="@{/requisicoes/{requisicaoId}/alocar-bolsa/{bolsaId}(requisicaoId=${requisicao.id},bolsaId=${bolsa.id})}" method="post">
            <button class="inline-flex items-center rounded-lg bg-hemo-moss px-3 py-2 text-xs font-semibold text-white hover:bg-hemo-mossHover" type="submit">Alocar</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(bolsas)}">
        <td class="px-4 py-6 text-center text-sm text-hemo-textSub" colspan="8"
            th:text="${requisicao == null ? 'Nenhuma bolsa cadastrada.' : (#strings.isEmpty(requisicao.tipoSanguineo) ? 'A requisição não possui tipo sanguíneo cadastrado.' : 'Nenhuma bolsa compatível com o tipo sanguíneo da requisição.')}">
          Nenhuma bolsa cadastrada.
        </td>
      </tr>
    </tbody>
  </table>
</div>
