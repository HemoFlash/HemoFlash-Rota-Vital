global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "hemo-flash"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app:8081"]
        labels:
          service: "rota-vital"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]